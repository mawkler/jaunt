[package]
name = "jaunt"
description = "Run-or-raise for Hyprland and Niri"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-channel = "2.5.0"
clap = { version = "4.5.51", features = ["derive"] }
enum_dispatch = "0.3.13"
glib = "0.22.10"
inotify = "0.11.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.4.4"
rustix = { version = "1.1.5", features = ["process"] }
toml = "1.1.6"
